# Environment: local docker-compose cluster. Add config/env/<name>.properties for cloud.
env_name=local
jdbc_url=jdbc:ignite:thin://localhost:10800\,localhost:10801\,localhost:10802
zone_partitions=25
zone_replicas=3
# informational, copied into the report
cluster_nodes=3
cluster_node_spec=2 vCPU / 4 GiB per node (docker, shared Mac host)
# resource sampler: docker | none
collector=docker
collector_containers=gg9-node1,gg9-node2,gg9-node3
# fault injection (framework/chaos.py): docker containers named <prefix><node>, REST on base+N-1
chaos_driver=docker
chaos_container_prefix=gg9-
chaos_rest_port_base=10300
chaos_stop_grace_sec=30
# independent availability probe (framework/Probe.java): each node alone + the multi-endpoint cluster URL
probe_targets=node1,node2,node3,cluster
probe_url_node1=jdbc:ignite:thin://localhost:10800
probe_url_node2=jdbc:ignite:thin://localhost:10801
probe_url_node3=jdbc:ignite:thin://localhost:10802
probe_url_cluster=jdbc:ignite:thin://localhost:10800\,localhost:10801\,localhost:10802
chaos_nodes=node1,node2,node3
