# 3-node GridGain 9 cluster for local framework development.
# Tunables (see config/local.env): GG_VERSION, GG_JVM_MEM, GG_NODE_CPUS, GG_NODE_MEM
x-node: &node
  image: gridgain/gridgain9:${GG_VERSION:-9.1.28}
  environment:
    JVM_MAX_MEM: ${GG_JVM_MEM:-2g}
    JVM_MIN_MEM: ${GG_JVM_MEM:-2g}
  cpus: ${GG_NODE_CPUS:-2}
  mem_limit: ${GG_NODE_MEM:-4g}
  volumes:
    - ./gridgain-config.conf:/opt/gridgain/etc/gridgain-config.conf:ro

services:
  node1:
    <<: *node
    container_name: gg9-node1
    command: --node-name node1
    ports: ["10300:10300", "10800:10800"]
  node2:
    <<: *node
    container_name: gg9-node2
    command: --node-name node2
    ports: ["10301:10300", "10801:10800"]
  node3:
    <<: *node
    container_name: gg9-node3
    command: --node-name node3
    ports: ["10302:10300", "10802:10800"]
