# Same fault as chaos-oltp-node-kill but with client timeouts + independent probe, to tell cluster stalls from JMeter-side hangs.
workload=oltp
mode=steady
threads=32
rampup=60
duration=1200
think_ms=20
mix_read=60
mix_update=15
mix_insert=5
mix_range=10
mix_tx=10
key_skew=2.0
warmup_sec=120
chaos_events=300:kill:node2,480:start:node2
pool_check_query=SELECT 1
query_timeout_sec=10
connect_timeout_ms=5000
probe=true
probe_timeout_sec=5
