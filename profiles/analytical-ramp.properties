# Ramp analytical concurrency until failures (errors/timeouts) start occurring. See oltp-ramp for the mechanism.
workload=analytical
mode=ramp
threads=512
rampup=1800
duration=1860
think_ms=200
mix_agg=30
mix_join=30
mix_topn=10
mix_lookup=25
mix_distinct=5
olap_window_days=30
query_timeout_sec=10
connect_timeout_ms=10000
stop_error_pct=1
stop_p95_ms=0
stop_consecutive=3
window_sec=10
stop_grace_sec=60
