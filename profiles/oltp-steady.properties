# Real-world OLTP: fixed concurrency for a fixed period after a short warm-up ramp.
workload=oltp
mode=steady
threads=64
rampup=120
duration=1800
think_ms=0
# operation mix (relative weights)
mix_read=60
mix_update=15
mix_insert=5
mix_range=10
mix_tx=10
key_skew=2.0
# reporting: samples before this many seconds are excluded from steady-state stats
warmup_sec=120
