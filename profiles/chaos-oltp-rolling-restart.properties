# Rolling restart of all three nodes one at a time (upgrade/maintenance simulation).
workload=oltp
mode=steady
threads=32
rampup=60
duration=1200
think_ms=20
mix_read=60
mix_update=15
mix_insert=5
mix_range=10
mix_tx=10
key_skew=2.0
warmup_sec=120
chaos_events=300:stop:node1,360:start:node1,480:stop:node2,540:start:node2,660:stop:node3,720:start:node3
# evict dead connections after a node loss (validate on borrow)
pool_check_query=SELECT 1
