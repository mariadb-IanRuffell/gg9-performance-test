# Ramp concurrency until FAILURES start occurring: the watchdog stops the run when the error rate stays >= stop_error_pct
# for stop_consecutive windows. Client timeouts turn overload into errors; the suite escalates threads x2 if the ceiling is
# reached without failures. stop_p95_ms=0 disables the latency criterion (errors only).
workload=oltp
mode=ramp
threads=2000
rampup=2400
duration=2460
think_ms=0
mix_read=60
mix_update=15
mix_insert=5
mix_range=10
mix_tx=10
key_skew=2.0
query_timeout_sec=5
connect_timeout_ms=10000
stop_error_pct=1
stop_p95_ms=0
stop_consecutive=3
window_sec=10
stop_grace_sec=60
