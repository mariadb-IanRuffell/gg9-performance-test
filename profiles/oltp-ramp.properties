# Ramp concurrency linearly until the cluster breaks the SLO; the watcher stops the run at the breakpoint.
workload=oltp
mode=ramp
threads=1024
rampup=1800
duration=1860
think_ms=0
mix_read=60
mix_update=15
mix_insert=5
mix_range=10
mix_tx=10
key_skew=2.0
# breakpoint criteria (any, sustained for stop_consecutive windows)
stop_error_pct=2
stop_p95_ms=1000
stop_consecutive=3
window_sec=10
