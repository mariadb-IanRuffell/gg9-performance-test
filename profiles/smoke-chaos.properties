# 3-minute check of the fault injector + report: graceful stop of node3 at 40s, restart at 80s.
workload=oltp
mode=steady
threads=16
rampup=10
duration=180
think_ms=20
mix_read=60
mix_update=15
mix_insert=5
mix_range=10
mix_tx=10
key_skew=2.0
warmup_sec=15
pool_check_query=SELECT 1
chaos_events=40:stop:node3,80:start:node3
