# Crash a node during sustained batch ingest.
workload=ingest
mode=steady
threads=8
rampup=60
duration=1200
think_ms=0
ingest_batch=500
mix_ingest_single=10
warmup_sec=60
chaos_events=300:kill:node3,480:start:node3
# evict dead connections after a node loss (validate on borrow)
pool_check_query=SELECT 1
