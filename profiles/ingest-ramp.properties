# Ramp batch-ingest concurrency until failures start occurring. See oltp-ramp for the mechanism.
workload=ingest
mode=ramp
threads=512
rampup=1800
duration=1860
think_ms=0
ingest_batch=500
mix_ingest_single=10
query_timeout_sec=10
connect_timeout_ms=10000
stop_error_pct=1
stop_p95_ms=0
stop_consecutive=3
window_sec=10
stop_grace_sec=60
